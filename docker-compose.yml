
services:
  backend:
   build:
    context: ./server
    dockerfile: Dockerfile
   container_name: backendd
   restart: always
   env_file:
      - ./server/.env
   ports:
      - "8000:8000" 

  frontend:
   build:
    context: ./client
    dockerfile: Dockerfile
   container_name: frontendd
   restart: always
   ports:
      - "4000:4000"
   depends_on:
      - backend   
